<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pinturas | Galería de Arte</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #d9dde1;
        }

        .navbar {
            background-color: #34495e !important;
        }

        .tabla-contenedor {
            background-color: #f1f3f5;
            border-radius: 10px;
            padding: 30px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                Galería de Arte
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="{% url 'listar_pinturas' %}">
                    Pinturas
                </a>
                <a class="nav-link" href="#">Autores</a>
                <a class="nav-link" href="#">Galerías</a>
            </div>

        </div>
    </nav>


    <!-- CONTENIDO -->
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1 class="mb-0">Pinturas</h1>

            <div class="d-flex gap-2">

                <!-- BUSCADOR -->
                <form method="GET" class="d-flex">

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        placeholder="Buscar Pintura..."
                        value="{{ request.GET.nombre }}"
                    >

                    <button type="submit" class="btn btn-primary ms-2">
                        Buscar
                    </button>

                </form>

                <!-- NUEVA PINTURA -->
                <a href="{% url 'crear_pintura' %}" class="btn btn-success">
                    + Nueva pintura
                </a>
                

            </div>

        </div>


        <!-- TABLA -->
        <div class="tabla-contenedor shadow-sm">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Autor</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>

                <tbody>

                    {% for pintura in pinturas %}

                    <tr>

                        <td>{{ pintura.nombre }}</td>

                        <td>{{ pintura.autor }}</td>

                        <td class="text-center">

                            <a href="{% url 'ver_pintura' pintura.pk %}"
                               class="btn btn-primary btn-sm">
                                Ver
                            </a>

                            <button class="btn btn-secondary btn-sm">
                                Editar
                            </button>

                            <button class="btn btn-danger btn-sm">
                                Eliminar
                            </button>

                        </td>

                    </tr>

                    {% empty %}

                    <tr>
                        <td colspan="3" class="text-center">
                            No hay pinturas cargadas.
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
